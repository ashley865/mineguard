services:
  - type: web
    name: mineguard-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_ORIGIN
        sync: false
      - key: SIMULATOR_INTERVAL_MS
        value: 5000
      # Optional: AI assistant stays dormant until this is set in the Render
      # dashboard. Works with any OpenAI-compatible endpoint — see server/.env.example.
      - key: AI_API_KEY
        sync: false
